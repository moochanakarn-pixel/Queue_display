<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
<defs>
  <linearGradient id="a" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#f0f5eb"/>
    <stop offset="45%"  stop-color="#c8ddb4"/>
    <stop offset="100%" stop-color="#8fb58a"/>
  </linearGradient>
  <radialGradient id="r1" cx="75%" cy="20%" r="50%">
    <stop offset="0%"   stop-color="#5a8c3c" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#f0f5eb"  stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="r2" cx="10%" cy="85%" r="45%">
    <stop offset="0%"   stop-color="#3d6b21" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#f0f5eb"  stop-opacity="0"/>
  </radialGradient>
  <!-- subtle soft circle overlays (matcha powder feel) -->
  <radialGradient id="c1" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#a8c97e" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#a8c97e" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="1920" height="1080" fill="url(#a)"/>
<rect width="1920" height="1080" fill="url(#r1)"/>
<rect width="1920" height="1080" fill="url(#r2)"/>
<!-- soft bokeh circles -->
<ellipse cx="320"  cy="200"  rx="220" ry="220" fill="url(#c1)" opacity="0.7"/>
<ellipse cx="1600" cy="860"  rx="280" ry="280" fill="url(#c1)" opacity="0.6"/>
<ellipse cx="960"  cy="1000" rx="180" ry="180" fill="url(#c1)" opacity="0.5"/>
</svg>
